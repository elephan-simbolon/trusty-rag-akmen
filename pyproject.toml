[project]
name = "trusty-rag-akmen"
version = "0.1.0"
description = "AI-powered cost & management accounting assistant using RAG (Retrieval-Augmented Generation)"
requires-python = ">=3.11,<3.13"
dependencies = [
    "torch",
    "langgraph==1.1.3",
    "langchain==1.2.13",
    "langchain-qdrant",
    "qdrant-client==1.17.1",
    "mineru==3.0.3",
    "docling==2.81.0",
    "pymupdf==1.27.2.2",
    "llama-index-core==0.14.18",
    "chonkie[semantic]==1.6.1",
    "pydantic-settings>=2.0",
    "tenacity",
    "python-dotenv",
    "openai",
    "httpx",
    "langfuse>=4.0.1",
    "ragas>=0.2",
    "fast-graphrag",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "aiosqlite>=0.20.0",
    "sse-starlette>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-timeout",
    "pytest-asyncio",
    "pytest-cov",
    "ruff>=0.9.0",
]

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu126" }

[tool.hatch.build.targets.wheel]
packages = ["src", "config", "scripts", "backend"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]
