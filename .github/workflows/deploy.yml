name: Deploy

on:
  # Trigger manual dengan pilihan environment
  workflow_dispatch:
    inputs:
      environment:
        description: "Deployment environment"
        required: true
        default: "production"
        type: choice
        options:
          - production
          - staging

  # Uncomment setelah deployment target dikonfirmasi:
  # workflow_run:
  #   workflows: ["CI"]
  #   types: [completed]
  #   branches: [main, master]

jobs:
  # ─────────────────────────────────────────────
  # Pre-deploy: Build frontend
  # ─────────────────────────────────────────────
  build-frontend:
    name: Build Frontend
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Build for production
        working-directory: frontend
        run: npm run build

      - name: Upload dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist-${{ github.sha }}
          path: frontend/dist/
          retention-days: 1

  # ─────────────────────────────────────────────
  # Deploy — PILIH SATU OPSI DAN UNCOMMENT
  # ─────────────────────────────────────────────
  deploy:
    name: Deploy (${{ github.event.inputs.environment }})
    runs-on: ubuntu-latest
    needs: build-frontend
    environment: ${{ github.event.inputs.environment }}

    steps:
      - uses: actions/checkout@v4

      - name: Download frontend dist
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist-${{ github.sha }}
          path: frontend/dist/

      # ── OPSI A: Docker + SSH ke VPS ────────────────────────────────────────
      # Secrets yang dibutuhkan: REGISTRY_TOKEN, DEPLOY_HOST, DEPLOY_USER, DEPLOY_SSH_KEY
