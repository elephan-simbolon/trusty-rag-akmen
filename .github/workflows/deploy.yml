name: Deploy

on:
  # Trigger manual dengan pilihan environment
  workflow_dispatch:
    inputs:
      environment:
        description: "Deployment environment"
        required: true
        default: "production"
        type: choice
        options:
          - production
          - staging

  # Auto-deploy ke production setelah CI pass di main
  # Uncomment jika sudah siap:
  # workflow_run:
  #   workflows: ["CI"]
  #   types: [completed]
  #   branches: [main]

# Deploy hanya butuh baca repo; write permissions (packages, deployments)
# ditambahkan per-job sesuai kebutuhan.
permissions:
  contents: read

jobs:
  # ─────────────────────────────────────────────
  # Pre-deploy: Build frontend
  # ─────────────────────────────────────────────
  build-frontend:
    name: Build Frontend
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Build for production
        working-directory: frontend
        run: npm run build

      - name: Upload dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist-${{ github.sha }}
          path: frontend/dist/
          retention-days: 1

  # ─────────────────────────────────────────────
  # Deploy Frontend ke Vercel (Opsi C)
  # ─────────────────────────────────────────────
  deploy-frontend:
    name: Deploy Frontend → Vercel (${{ github.event.inputs.environment }})
    runs-on: ubuntu-latest
    needs: build-frontend
    environment: ${{ github.event.inputs.environment }}

    steps:
      - uses: actions/checkout@v5

      - name: Download frontend dist
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist-${{ github.sha }}
          path: frontend/dist/

      # ── Vercel Deploy ───────────────────────────────────────────────────────
      # Secrets yang dibutuhkan (set di GitHub repo Settings > Secrets):
      #   VERCEL_TOKEN       — dari https://vercel.com/account/tokens
      #   VERCEL_ORG_ID      — dari .vercel/project.json setelah `vercel link`
      #   VERCEL_PROJECT_ID  — dari .vercel/project.json setelah `vercel link`
      #
      # VITE_API_BASE_URL harus di-set di Vercel Dashboard > Project > Settings >
      # Environment Variables agar frontend tahu endpoint backend.
      - name: Deploy ke Vercel
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          working-directory: frontend/dist
          vercel-args: ${{ github.event.inputs.environment == 'production' && '--prod' || '' }}

  # ─────────────────────────────────────────────
  # Deploy Backend — belum dikonfigurasi
  # ─────────────────────────────────────────────
  # Uncomment dan sesuaikan saat backend deployment target sudah ditentukan.
