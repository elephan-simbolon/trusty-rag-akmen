name: CI

on:
  push:
    branches: [main, master]
    paths-ignore:
      - "*.md"
      - "docs/**"
      - ".planning/**"
      - "LICENSE"
  pull_request:
    branches: [main, master]
    paths-ignore:
      - "*.md"
      - "docs/**"
      - ".planning/**"
      - "LICENSE"

# Batalkan run lama jika push baru masuk ke branch yang sama
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Prinsip least privilege — CI hanya butuh baca repo
permissions:
  contents: read

env:
  PYTHON_VERSION: "3.11"

jobs:
  # ─────────────────────────────────────────────
  # Job 1: Python unit tests
  # ─────────────────────────────────────────────
  test:
    name: Unit Tests (Python 3.11)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: "**/uv.lock"

      - name: Install Python ${{ env.PYTHON_VERSION }}
        run: uv python install ${{ env.PYTHON_VERSION }}

      - name: Install dependencies (CPU-only)
        # --no-sources: abaikan tool.uv.sources (pytorch-cu126), resolve torch dari PyPI.
        run: uv sync --extra dev --no-sources

      - name: Run tests
        run: |
          uv run pytest \
            -m "not integration and not e2e and not gpu" \
            --timeout=60 \
            --cov=src --cov=backend --cov=config \
            --cov-report=xml --cov-report=term-missing \
            -q --tb=short
        env:
          # Dummy values agar Settings() dapat diimport tanpa error.
          SILICONFLOW_API_KEY: "dummy-ci"
          QDRANT_URL: "http://localhost:6333"
          QDRANT_API_KEY: "dummy"
          DEEPSEEK_API_KEY: "dummy"

      - name: Upload coverage
        if: always()
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage.xml
          fail_ci_if_error: false

  # ─────────────────────────────────────────────
  # Job 2: Lint dengan ruff
  # ─────────────────────────────────────────────
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: "**/uv.lock"

      - name: Install Python ${{ env.PYTHON_VERSION }}
        run: uv python install ${{ env.PYTHON_VERSION }}

      - name: Install dev deps only
        # --no-install-project: skip install project beserta dependencies-nya (termasuk torch).
        # Hanya dev extras yang diinstall (ruff, pytest, dll) — jauh lebih cepat.
        # --frozen: pastikan lockfile tidak drift.
        run: uv sync --frozen --extra dev --no-install-project

      - name: ruff check
        run: uv run ruff check src/ backend/ config/ tests/ scripts/ --output-format=github

      - name: ruff format check
        run: uv run ruff format --check src/ backend/ config/ tests/ scripts/

  # ─────────────────────────────────────────────
  # Job 3: Frontend build + lint
  # ─────────────────────────────────────────────
  build-frontend:
    name: Frontend Build (React + Vite)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint (ESLint)
        working-directory: frontend
        run: npm run lint

      - name: Build (tsc + vite)
        working-directory: frontend
        run: npm run build

      - name: Upload dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist/
          retention-days: 7
